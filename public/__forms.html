<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Forms - Dojo Yamato</title>
  </head>
  <body>
    <!--
      File tecnico per Netlify Forms.
      Serve a far riconoscere a Netlify il form React della pagina Contatti.
      Non linkare questa pagina nel sito e non eliminarla.
    -->
    <form name="contatti-dojo-yamato" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contatti-dojo-yamato" />
      <input name="bot-field" />
      <input type="text" name="nome" />
      <input type="text" name="cognome" />
      <input type="text" name="eta" />
      <input type="tel" name="telefono" />
      <input type="email" name="email" />
      <textarea name="note"></textarea>
    </form>
  </body>
</html>
