<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dojo Yamato Arti Marziali</title>
  </head>
  <body>
    <!--
      Form nascosto necessario a Netlify Forms per riconoscere il form React durante il build.
      Non rimuovere se vuoi ricevere le richieste dalla pagina Contatti / Richiedi informazioni.
      Il name deve essere identico al form-name usato nel form React.
    -->
    <form name="richiesta-informazioni" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="richiesta-informazioni" />
      <input name="bot-field" />
      <input type="text" name="nome" />
      <input type="text" name="cognome" />
      <input type="text" name="eta" />
      <input type="tel" name="telefono" />
      <input type="email" name="email" />
      <textarea name="note"></textarea>
    </form>

    <!--
      Form nascosto Netlify Forms per ricevere via email le nuove richieste iscrizione.
      La submission viene inviata dal frontend dopo la registrazione utente.
    -->
    <form name="approvazione-iscrizione" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="approvazione-iscrizione" />
      <input name="bot-field" />
      <input type="text" name="nome" />
      <input type="text" name="cognome" />
      <input type="email" name="email" />
      <input type="tel" name="telefono" />
      <input type="text" name="data_nascita" />
      <input type="text" name="indirizzo" />
      <input type="text" name="citta" />
      <input type="text" name="stato" />
      <input type="text" name="ruolo" />
      <input type="url" name="approva_url" />
      <input type="url" name="rifiuta_url" />
      <textarea name="note"></textarea>
    </form>


    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
